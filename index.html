<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kangi</title>
<style>
/* 밝은 화면이 기본. 시스템이 다크 모드여도 따라가지 않는다.
   야간 모드는 상단 버튼으로 직접 켤 때만 적용된다. */
:root{
  /* 껍데기 — 초록은 여기에만 (책상·상단바·하단바) */
  --chrome:#17795a;
  --chrome-ink:#f7fcf9;
  --chrome-soft:#e0f2e9;
  --chrome-line:rgba(255,255,255,.24);
  --chrome-fill:rgba(255,255,255,.13);
  --chrome-accent:#cbf5e2;

  /* 지면 — 밝고 중립적인 종이. 글자는 초록기 없이 */
  --paper:#f5f7f4;
  --block:#e9ede8;
  --ink:#1d2124;
  --ink-soft:#4c5257;
  --ink-faint:#646a6e;
  --line:#dde2dc;
  --line-soft:#ebefe9;
  --accent:#00704a;    /* 구조에만 쓰는 초록 — 주제 구분선·책갈피 */
  --accent-soft:#dfeee6;
  --jp:#14181b;
  --ko:#545c62;        /* 예문 해석 — 눈에 안 튀는 회색 */
  --badge:#e9ede8;
  --gutter:rgba(20,40,30,.15);
  --scrim:rgba(15,30,22,.45);
  --shadow:0 14px 40px rgba(5,40,25,.26), 0 3px 10px rgba(5,40,25,.16);
}
:root[data-theme="dark"]{
  --chrome:#0d3b2c;
  --chrome-ink:#eaf5ef;
  --chrome-soft:#b5d4c5;
  --chrome-line:rgba(255,255,255,.14);
  --chrome-fill:rgba(255,255,255,.08);
  --chrome-accent:#8fe0bb;

  --paper:#171a1c;
  --block:#1f2326;
  --ink:#e5e8ea;
  --ink-soft:#a5abb0;
  --ink-faint:#868d92;
  --line:#2c3134;
  --line-soft:#23282b;
  --accent:#4fbb8b;
  --accent-soft:#1b2a23;
  --jp:#f2f5f7;
  --ko:#9aa3aa;
  --badge:#22272a;
  --gutter:rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.55);
  --shadow:0 14px 40px rgba(0,0,0,.5), 0 3px 10px rgba(0,0,0,.32);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; height:100dvh; overflow:hidden;
  display:flex; flex-direction:column;
  background:var(--chrome); color:var(--ink);
  font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",
              "Yu Gothic","Meiryo","Hiragino Kaku Gothic ProN","Noto Sans JP",
              system-ui,-apple-system,sans-serif;
  line-height:1.6; -webkit-font-smoothing:antialiased;
}
.jp{font-family:"Yu Gothic","YuGothic","Meiryo","Hiragino Kaku Gothic ProN","Noto Sans JP","MS PGothic",sans-serif}
button{font-family:inherit}
:focus-visible{outline:2px solid currentColor; outline-offset:2px}

/* ================= 상단 바 ================= */
.topbar{
  flex:none; display:flex; align-items:center; gap:10px;
  padding:9px 16px; border-bottom:1px solid var(--chrome-line);
  background:var(--chrome); color:var(--chrome-ink);
}
.brand{font-weight:700; font-size:16px; letter-spacing:.02em; white-space:nowrap}
.modes{
  display:flex; gap:2px; margin-right:auto; flex:none;
  background:var(--chrome-fill); border:1px solid var(--chrome-line);
  border-radius:9px; padding:2px;
}
.mbtn{
  border:none; background:none; color:var(--chrome-soft);
  font-size:12.5px; padding:5px 13px; border-radius:7px; cursor:pointer; white-space:nowrap;
}
.mbtn.on{background:var(--chrome-ink); color:var(--chrome); font-weight:600}
.brand em{font-style:normal; color:var(--chrome-accent); font-size:12px; margin-left:6px; letter-spacing:.08em}
.rate{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--chrome-soft); white-space:nowrap}
.rate input[type=range]{width:88px; accent-color:var(--chrome-accent)}
.rate .v{font-variant-numeric:tabular-nums; width:30px}
.tbtn{
  border:1px solid var(--chrome-line); background:var(--chrome-fill); color:var(--chrome-ink);
  border-radius:8px; padding:6px 11px; font-size:13px; cursor:pointer; line-height:1.4;
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.tbtn svg{width:14px; height:14px}

/* ================= 무대 / 책 ================= */
.stage{flex:1; min-height:0; padding:16px; display:flex}
.spread{
  flex:1; min-height:0; display:flex;
  background:var(--paper); border:1px solid var(--line);
  border-radius:14px; box-shadow:var(--shadow); overflow:hidden;
  max-width:1180px; margin:0 auto; width:100%;
}
.page{flex:1; min-width:0; display:flex; flex-direction:column; position:relative}
.spread .page + .page{
  border-left:1px solid var(--line);
  box-shadow:inset 14px 0 22px -18px var(--gutter);
}
.spread .page:first-child:not(:only-child){box-shadow:inset -14px 0 22px -18px var(--gutter)}

.running{
  flex:none; display:flex; align-items:baseline; gap:8px;
  padding:14px 24px 9px; border-bottom:1px solid var(--line-soft);
  font-size:12px; letter-spacing:.09em; color:var(--ink-faint); text-transform:uppercase;
}
.running b{font-weight:600; color:var(--ink-soft); letter-spacing:.02em; text-transform:none; font-size:13px}
.running .range{margin-left:auto; font-variant-numeric:tabular-nums; letter-spacing:.02em}

.page-body{flex:1; min-height:0; overflow:hidden; padding:2px 24px 6px}
/* 항목 하나가 쪽보다 큰 화면(아주 낮은 가로 화면 등)에서만 예외로 스크롤을 연다.
   조용히 잘리는 것보다 낫다. */
.page-body.scrollable{overflow-y:auto; overscroll-behavior:contain}
.folio{
  flex:none; text-align:center; padding:8px 0 12px;
  font-size:11.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums;
  letter-spacing:.14em; border-top:1px solid var(--line-soft);
}

/* ================= 단어 항목 ================= */
.sec-break{
  display:flex; align-items:center; gap:10px;
  margin:14px 0 2px; font-size:12px; font-weight:600; color:var(--accent);
  letter-spacing:.02em;
}
.sec-break::after{content:""; flex:1; height:1px; background:var(--line)}

.entry{padding:11px 0 12px; border-bottom:1px solid var(--line-soft)}
.entry:last-child{border-bottom:none}
.e-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.num{font-size:11px; color:var(--ink-faint); font-variant-numeric:tabular-nums; flex:none}
.word{font-size:22px; font-weight:600; color:var(--jp); line-height:1.35}
.read{font-size:14px; color:var(--ink-soft)}
.pos{font-size:10px; color:var(--ink-faint); background:var(--badge); border-radius:4px; padding:2px 6px; flex:none}
.mean{font-size:15px; font-weight:500; margin:1px 0 0 0}
.ex{margin-top:7px; padding:8px 11px; background:var(--block); border-radius:8px; border:1px solid var(--line-soft)}
.ex-jp{font-size:15px; color:var(--jp); display:flex; align-items:flex-start; gap:7px; line-height:1.6}
.ex-kana{font-size:14px; color:var(--ink-soft); margin-top:4px; line-height:1.55}

/* 한자에 마우스를 올리면 읽기가 뜬다. 아래 가나 줄에서 해당 부분도 같이 밝아진다.
   말풍선은 절대 위치라 줄 높이를 건드리지 않는다 — 쪽 나눔이 흔들리면 안 되므로. */
.kj{position:relative; cursor:help; border-bottom:1px dotted var(--line)}
.kj::after{
  content:attr(data-r);
  position:absolute; left:50%; bottom:calc(100% + 4px); transform:translateX(-50%);
  background:var(--ink); color:var(--paper);
  font-size:12.5px; line-height:1.35; padding:3px 8px; border-radius:6px;
  white-space:nowrap; pointer-events:none; z-index:5;
  opacity:0; transition:opacity .12s;
}
.kj.on{border-bottom-color:var(--accent); color:var(--accent)}
.kj.on::after{opacity:1}
/* 좌우 패딩을 주면 안 된다 — 인라인 스팬의 가로 크기가 달라져 줄바꿈이 바뀌고,
   쪽 높이를 평문으로 재는 최적화가 어긋난다. 배경만으로 강조한다. */
.kr{border-radius:3px}
.kr.lit{background:var(--accent-soft); color:var(--accent); font-weight:600}
@media (prefers-reduced-motion:reduce){.kj::after{transition:none}}
.ex-ko{font-size:13.5px; color:var(--ko); margin-top:4px; line-height:1.5}

/* ---- 표지 ---- */
.cover-page{display:flex; align-items:center; justify-content:center}
.entry.cover{
  border:none; padding:0; width:100%; text-align:center;
  display:flex; flex-direction:column; align-items:center;
}
.cv-no{
  font-size:15px; font-weight:700; color:var(--accent);
  letter-spacing:.22em; margin-bottom:16px;
}
.cv-t{font-size:34px; font-weight:700; color:var(--jp); margin:0; letter-spacing:-.01em; line-height:1.2}
.cv-sub{font-size:15px; color:var(--ink-soft); margin-top:6px}
.cv-rule{width:48px; height:2px; background:var(--accent); margin:18px 0}
.cv-lead{font-size:14.5px; line-height:1.7; color:var(--ink); max-width:32ch; margin:0 0 18px}
.cv-list{list-style:none; margin:0 0 20px; padding:0; text-align:left; display:flex; flex-direction:column; gap:6px}
.cv-list li{font-size:13.5px; color:var(--ink-soft); padding-left:19px; position:relative}
.cv-list li::before{content:"—"; position:absolute; left:0; color:var(--accent)}
.cv-meta{font-size:11.5px; color:var(--ink-faint); letter-spacing:.1em}
.cv-peek{display:flex; flex-wrap:wrap; justify-content:center; gap:6px; max-width:30ch}
.cv-peek span{
  font-size:13.5px; color:var(--ink-soft);
  background:var(--block); border:1px solid var(--line);
  border-radius:999px; padding:4px 11px;
}
@media (max-height:620px){
  .cv-t{font-size:27px}
  .cv-rule{margin:13px 0}
  .cv-lead{margin-bottom:13px}
  .cv-list{gap:4px; margin-bottom:14px}
}
@media (max-height:580px){
  .cv-no{margin-bottom:10px; font-size:13px}
  .cv-t{font-size:24px}
  .cv-sub{font-size:13.5px}
  .cv-rule{margin:10px 0}
  .cv-lead{font-size:13.5px; line-height:1.6; margin-bottom:10px}
  .cv-list li{font-size:12.5px}
  .cv-list{gap:3px; margin-bottom:10px}
}
/* 폰 가로처럼 세로가 아주 짧을 때. 표지는 '어느 장이 시작되는지'만 알려주면 되므로
   미리보기와 항목 목록은 접는다. 안 접으면 잘린다. */
@media (max-height:480px){
  .cv-no{margin-bottom:5px; font-size:11.5px}
  .cv-t{font-size:20px}
  .cv-sub{font-size:12px; margin-top:2px}
  .cv-rule{width:34px; margin:8px 0}
  .cv-lead{font-size:12.5px; line-height:1.5; margin-bottom:0; max-width:52ch}
  .cv-peek, .cv-list, .cv-meta{display:none}
}

/* ---- 설명 카드 ---- */
.entry.note{
  background:var(--accent-soft); border:1px solid var(--line);
  border-left:3px solid var(--accent); border-radius:0 10px 10px 0;
  padding:13px 15px; margin:2px 0;
}
.note-t{margin:0 0 7px; font-size:14.5px; font-weight:700; color:var(--accent); letter-spacing:-.01em}
.note-p{margin:0 0 6px; font-size:13.5px; line-height:1.62; color:var(--ink)}
.note-p:last-of-type{margin-bottom:0}
.nrows{margin-top:9px; display:flex; flex-direction:column; gap:5px}
.nrow{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.ncell{
  font-size:13.5px; background:var(--paper); border:1px solid var(--line);
  border-radius:6px; padding:3px 9px; color:var(--ink);
}
.ncell.last{font-weight:600; border-color:var(--accent); color:var(--accent)}
.narrow{color:var(--ink-faint); font-size:12px}

/* ---- 짝 카드 (타동사 ↔ 자동사) ---- */
.entry.pair .p-arrow{color:var(--ink-faint); font-size:15px}
.prow{display:flex; gap:9px; margin-top:9px}
.ptag{
  flex:none; width:22px; height:22px; border-radius:6px; margin-top:2px;
  display:flex; align-items:center; justify-content:center;
  font-size:11px; font-weight:700;
}
.ptag.tr{background:var(--accent); color:var(--paper)}
.ptag.itr{background:var(--badge); color:var(--ink-soft); border:1px solid var(--line)}
.pmain{flex:1; min-width:0}
.pline{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.pline b{font-size:18px; font-weight:600; color:var(--jp)}
.entry.pair .mean-inline{font-size:13.5px; color:var(--ink-soft)}
.entry.pair .ex{margin-top:5px}

/* ---- 활용 카드 ---- */
.entry.conj .mean-inline{font-size:13.5px; color:var(--ink-soft)}
.chain{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-top:9px; padding:9px 11px;
  background:var(--accent-soft); border:1px solid var(--line); border-radius:8px;
}
.step{display:flex; flex-direction:column; line-height:1.25}
.step b{font-size:17px; font-weight:600; color:var(--ink)}
.step em{font-style:normal; font-size:10.5px; color:var(--ink-faint); margin-top:2px}
.step.hit b{color:var(--accent)}
.step.hit em{color:var(--accent); opacity:.8}
.carrow{color:var(--ink-faint); font-size:13px; align-self:flex-start; margin-top:4px}
.chain .spk{margin-left:auto; align-self:center}

/* ---- 형용사 활용 카드 ---- */
/* 네 형태(현재·부정·과거·과거부정)를 한눈에 두는 게 목적이라 표처럼 깐다.
   폭은 화면이 아니라 '지면'이 정하므로 auto-fit으로 담는 칸이 알아서 접히게 한다.
   (펼침면에서는 지면이 화면의 절반이라 미디어쿼리로는 맞출 수 없다) */
.entry.adjc .mean-inline{font-size:13.5px; color:var(--ink-soft)}
.fgrid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(178px, 1fr));
  gap:6px; margin-top:9px;
}
.fcell{
  display:flex; align-items:flex-start; gap:6px; min-width:0;
  padding:7px 9px; background:var(--accent-soft);
  border:1px solid var(--line); border-radius:8px;
}
.ftxt{flex:1; min-width:0}
.fcell em{display:block; font-style:normal; font-size:10.5px; color:var(--ink-faint)}
.fcell b{display:block; font-size:16px; font-weight:600; color:var(--ink); line-height:1.32; margin-top:1px}
.fcell .fr{display:block; font-size:11.5px; color:var(--ink-faint); line-height:1.4}
.fcell .spk{margin-top:2px}
.fcell.hit{border-color:var(--accent)}
.fcell.hit b{color:var(--accent)}

.entry.marked{
  background:linear-gradient(90deg, var(--accent-soft), transparent 70%);
  box-shadow:inset 3px 0 0 var(--accent);
  padding-left:11px; margin-left:-11px; border-radius:0 6px 6px 0;
}
@keyframes flash{0%,100%{background-color:transparent} 20%,60%{background-color:var(--accent-soft)}}
.entry.flash{animation:flash 1.5s ease-in-out}
@media (prefers-reduced-motion:reduce){.entry.flash{animation:none; outline:2px solid var(--accent)}}

/* 아이콘 버튼 */
.ibtn{
  flex:none; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft);
  border-radius:50%; width:24px; height:24px; padding:0; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center;
  transition:background .12s, border-color .12s, color .12s;
}
.ibtn svg{width:12px; height:12px; display:block}
.spk.playing{background:var(--accent); border-color:var(--accent); color:#fff}
.mark{margin-left:auto}
.mark.on{color:var(--accent); border-color:var(--accent); background:var(--accent-soft)}
.mark.on svg{fill:currentColor}

/* ================= 하단 조작 ================= */
.controls{
  flex:none; display:flex; align-items:center; justify-content:center; gap:14px;
  padding:9px 16px calc(9px + env(safe-area-inset-bottom));
  border-top:1px solid var(--chrome-line);
  background:var(--chrome); color:var(--chrome-ink);
}
.pbtn{
  border:1px solid var(--chrome-line); background:var(--chrome-fill); color:var(--chrome-ink);
  border-radius:9px; padding:7px 18px; font-size:14px; cursor:pointer;
}
.pbtn:disabled{opacity:.35; cursor:default}
.pageno{font-size:13px; color:var(--chrome-soft); font-variant-numeric:tabular-nums; min-width:82px; text-align:center}
.pageno b{color:var(--chrome-ink); font-weight:600}

/* ================= 서랍 ================= */
.scrim{
  position:fixed; inset:0; z-index:80; background:var(--scrim);
  opacity:0; pointer-events:none; transition:opacity .18s;
}
.scrim.open{opacity:1; pointer-events:auto}
.drawer{
  position:fixed; z-index:90; top:0; right:0; height:100dvh; width:min(380px,88vw);
  background:var(--paper); border-left:1px solid var(--line);
  transform:translateX(100%); transition:transform .22s ease;
  display:flex; flex-direction:column;
}
.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.drawer-head{flex:none; display:flex; gap:6px; padding:12px 12px 0; border-bottom:1px solid var(--line)}
.dtab{
  border:none; background:none; color:var(--ink-faint); cursor:pointer;
  padding:9px 13px; font-size:13.5px; border-bottom:2px solid transparent; margin-bottom:-1px;
}
.dtab.on{color:var(--accent); border-bottom-color:var(--accent); font-weight:600}
.dclose{margin-left:auto; border:none; background:none; color:var(--ink-faint); cursor:pointer; font-size:20px; padding:6px 10px}
.drawer-body{flex:1; min-height:0; overflow-y:auto; padding:10px 12px 24px}
.qbox{flex:none; padding:10px 12px 0; display:none}
.qbox.on{display:block}
.qbox input{
  width:100%; padding:9px 12px; font-size:14px; font-family:inherit;
  border:1px solid var(--line); border-radius:9px;
  background:var(--block); color:var(--ink);
}
.qbox input:focus{outline:none; border-color:var(--accent)}
.qcount{font-size:12px; color:var(--ink-faint); margin:0 0 8px; padding:0 2px}
.dlink .tag{
  font-size:10px; color:var(--accent); background:var(--accent-soft);
  border-radius:4px; padding:2px 6px; margin-left:6px; white-space:nowrap;
}

.dlink{
  display:flex; align-items:baseline; gap:10px; width:100%; text-align:left;
  padding:10px 12px; border:1px solid var(--line); background:var(--paper); color:var(--ink);
  border-radius:9px; font-size:14px; cursor:pointer; margin-bottom:6px;
}
.dlink .p{margin-left:auto; font-size:11.5px; color:var(--ink-faint); font-variant-numeric:tabular-nums; white-space:nowrap}
.dlink .p.alt{
  color:var(--accent); background:var(--accent-soft);
  border-radius:4px; padding:2px 7px; font-weight:600;
}
.dlink .sub{font-size:12px; color:var(--ink-soft)}
.dlink .jpw{font-size:16px; font-weight:600}
.dempty{color:var(--ink-faint); font-size:13.5px; line-height:1.8; padding:14px 4px}

.notice{
  margin:0 16px 10px; padding:10px 13px; font-size:12.5px; color:var(--ink-soft);
  background:var(--accent-soft); border:1px solid var(--line); border-left:3px solid var(--accent);
  border-radius:9px;
}
.notice.hidden{display:none}

/* 좁은 화면에서는 상단바를 단계적으로 줄인다.
   모드 전환(단어/문법)은 끝까지 남긴다 — 없으면 문법에 갈 방법이 없다. */
@media (max-width:600px){
  .topbar{gap:6px; padding:9px 10px}
  .tbtn .lbl{display:none}
  .tbtn{padding:7px 8px}
  .brand em{display:none}
  .mbtn{padding:5px 9px; font-size:12px}
  .rate input[type=range]{width:44px}
}
@media (max-width:420px){
  .brand{display:none}
}
@media (max-width:760px){
  .stage{padding:10px}
  .running{padding:11px 15px 8px}
  .page-body{padding:2px 15px 6px}
  .rate .lbl,.rate .v{display:none}

}

/* 폰 가로처럼 세로가 짧을 때. 390px 중 상·하단바가 105px를 먹으면
   읽을 자리가 남지 않는다. 껍데기와 항목을 함께 조인다. */
@media (max-height:480px){
  .topbar{padding:5px 12px}
  .controls{padding:5px 16px calc(5px + env(safe-area-inset-bottom)); gap:10px}
  .pbtn{padding:5px 14px; font-size:13px}
  .stage{padding:8px}
  .running{padding:8px 16px 6px}
  .page-body{padding:2px 16px 4px}
  .folio{padding:4px 0 6px; font-size:10.5px}

  .entry{padding:8px 0 9px}
  .word{font-size:19px}
  .mean{font-size:14px}
  .ex{margin-top:5px; padding:6px 9px}
  .ex-jp{font-size:14px; line-height:1.5}
  .ex-kana{font-size:12.5px; line-height:1.45}
  .ex-ko{font-size:12.5px; line-height:1.45}
  .note-p{font-size:12.5px; line-height:1.5}
  .chain{margin-top:6px; padding:7px 9px}
}

@media (max-height:400px){
  .topbar{padding:4px 12px}
  .controls{padding:4px 16px calc(4px + env(safe-area-inset-bottom))}
  .stage{padding:6px}
  .running{padding:6px 14px 5px; font-size:11px}
  .folio{padding:3px 0 5px}
  .entry{padding:6px 0 7px}
  .word{font-size:18px}
  .mean{font-size:13.5px}
  .ex{margin-top:4px; padding:5px 8px}
  .ex-jp{font-size:13.5px}
  .ex-kana{font-size:12px}
  .ex-ko{font-size:12px}
}

/* ================= 입력 장치별 ================= */
/* 마우스가 있을 때만 hover. 터치에서는 탭한 뒤 hover가 남아 눌린 것처럼 보인다. */
@media (hover:hover){
  .mbtn:hover{color:var(--chrome-ink)}
  .tbtn:hover{border-color:var(--chrome-accent); color:var(--chrome-accent)}
  .ibtn:hover{border-color:var(--accent); color:var(--accent); background:var(--accent-soft)}
  .pbtn:hover:not(:disabled){border-color:var(--chrome-accent); color:var(--chrome-accent)}
  .dclose:hover{color:var(--accent)}
  .dlink:hover{border-color:var(--accent); color:var(--accent)}
  .kj:hover{border-bottom-color:var(--accent); color:var(--accent)}
  .kj:hover::after{opacity:1}
}
/* 손가락으로 누르는 화면에서는 표적을 키운다 */
@media (pointer:coarse){
  .ibtn{width:30px; height:30px}
  .ibtn svg{width:14px; height:14px}
  .pbtn{padding:11px 20px; font-size:15px}
  .tbtn{padding:9px 11px}
  .mbtn{padding:8px 13px}
  .dlink{padding:13px 12px}
  .dtab{padding:12px 15px}
  .dclose{padding:10px 12px}
  .rate input[type=range]{height:24px}
}

@media print{
  body{height:auto; overflow:visible; background:#fff; color:#000; display:block}
  .topbar,.controls,.drawer,.scrim,.notice,.ibtn{display:none !important}
  .stage{display:block; padding:0}
  .spread{display:block; box-shadow:none; border:none; max-width:none}
  .page{display:block; height:auto; border:none !important; box-shadow:none !important}
  .page-body{display:block; overflow:visible; height:auto; padding:0}
  .sec-break{break-after:avoid; margin-top:18px}
  .entry{break-inside:avoid}
}

/* ============================================================
   단어 목록 평탄화
   ============================================================ */
// key는 단어 자체로 만든다. 단어를 추가하거나 순서를 바꿔도
// 책갈피와 읽던 위치가 어긋나지 않도록 하기 위함.
// 화면에 찍히는 단어 번호(001~902)는 '진짜 단어'만 센다.
// 표지·설명·활용 카드가 섞여도 번호가 밀리지 않도록.
const WORDS = [];
let wordNo = 0;
DATA.forEach((sec, si) => sec.items.forEach((it, j) => {
  const plain = !it.cover && !it.note && !it.conj && !it.pair && !it.adjc;
  if(plain) wordNo++;
  // 활용 카드는 강의마다 같은 동사가 다시 나온다 (買う가 〜たい에도 〜て형에도 있음).
  // 그래서 목표 형태(say)까지 넣어야 key가 갈린다. 안 그러면 예문 캐시와 책갈피가 섞인다.
  const key = it.cover ? 'cover|' + si
            : it.note ? 'note|' + si + '|' + j
            : it.pair ? 'pair|' + it.tr.w + '|' + it.itr.w
            : it.adjc ? 'adjc|' + it.w + '|' + it.r
            : it.conj ? 'conj|' + it.w + '|' + it.say
            : it.w + '|' + it.r;
  WORDS.push({...it, si, sec:sec.t, kind:sec.kind || 'word', key, n:plain ? wordNo : null});
}));

const SEC_INFO = DATA.map((sec, si) => {
  const items = WORDS.filter(w => w.si === si);
  const plains = items.filter(w => w.n !== null);
  return {title:sec.t,
          first:WORDS.findIndex(w => w.si === si),
          kind:sec.kind || 'word',
          count:items.filter(w => !w.cover).length,   // 표지는 항목 수에서 뺀다
          from:plains.length ? plains[0].n : null,
          to:plains.length ? plains[plains.length - 1].n : null};
});

/* ============================================================
   저장 상태  (위치는 '쪽번호'가 아니라 '단어 번호'로 저장한다.
   창 크기에 따라 쪽 나눔이 달라지기 때문)
   ============================================================ */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
// 저장은 단어 key로, 화면 안에서는 번호로 다룬다.
const markedKeys = new Set(store.get('kangi-bookmarks', []));
const marks = new Set();
WORDS.forEach((w, i) => { if(markedKeys.has(w.key)) marks.add(i); });
const saveMarks = () => store.set('kangi-bookmarks', [...marks].map(i => WORDS[i].key));

// 「단어」와 「문법」은 각각 별개의 책처럼 다룬다.
// 목차·쪽수·읽던 위치가 모드마다 따로 유지된다.
let mode = store.get('kangi-mode', 'word');
if(mode !== 'word' && mode !== 'grammar') mode = 'word';

let anchor = 0;
function loadAnchor(){
  anchor = WORDS.findIndex(w => w.kind === mode);
  if(anchor < 0) anchor = 0;
  const savedKey = store.get('kangi-anchor-' + mode, null);
  if(savedKey){
    const i = WORDS.findIndex(w => w.key === savedKey && w.kind === mode);
    if(i >= 0) anchor = i;
  }
}
loadAnchor();

/* ============================================================
   조각 렌더링
   ============================================================ */
const ICON = {
  spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a9 9 0 0 1 0 14"/></svg>',
  mark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21 12 16 5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>'
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const spkBtn = t => '<button class="ibtn spk" type="button" data-say="' + esc(t) + '" aria-label="발음 듣기">' + ICON.spk + '</button>';
const breakHTML = sec => '<div class="sec-break">' + esc(sec) + '</div>';

/* ============================================================
   한자 ↔ 읽기 짝짓기

   예문은 한자 문장(e)과 히라가나 문장(ek)을 둘 다 갖고 있다.
   한자가 아닌 부분(가나·기호)은 양쪽에 똑같이 나타나므로,
   그 부분을 기준점 삼아 사이 구간을 한자 덩어리의 읽기로 본다.

     毎朝七時に起きます。
     まいあさしちじにおきます。
     → 「に」와 「きます。」를 기준점으로 잡으면
       毎朝七時 = まいあさしちじ, 起 = お

   덩어리 단위로만 나눈다. 毎朝七時를 한 글자씩 쪼개려면 사전이 필요한데
   그건 없으니, 정직하게 덩어리째 보여준다.
   어긋나면 null을 돌려주고 그 예문은 그냥 평문으로 그린다.
   ============================================================ */
const isKanji = ch => /[々〇㐀-䶿一-鿿]/.test(ch);

function alignRuby(text, kana){
  if(!text || !kana) return null;
  const chunks = [];
  let buf = '', mode = null;
  for(const ch of text){
    const m = isKanji(ch) ? 'k' : 'p';
    if(m !== mode){ if(buf) chunks.push({t:buf, k:mode === 'k'}); buf = ch; mode = m; }
    else buf += ch;
  }
  if(buf) chunks.push({t:buf, k:mode === 'k'});

  const out = [];
  let pos = 0;
  for(let i = 0; i < chunks.length; i++){
    const c = chunks[i];
    if(!c.k){
      if(kana.indexOf(c.t, pos) !== pos) return null;
      out.push({t:c.t, r:null});
      pos += c.t.length;
    }else{
      const next = chunks[i + 1];
      let end;
      if(!next) end = kana.length;
      else {
        end = kana.indexOf(next.t, pos + 1);   // 읽기는 최소 한 글자
        if(end < 0) return null;
      }
      if(end <= pos) return null;
      out.push({t:c.t, r:kana.slice(pos, end)});
      pos = end;
    }
  }
  return pos === kana.length ? out : null;
}

// 예문 한 덩어리. 한자에는 읽기를, 가나 줄에는 같은 번호를 붙여 짝을 만든다.
// 결과는 단어마다 고정이라 캐시한다 — 창 크기가 바뀔 때마다 900번씩 다시 계산할 이유가 없다.
//
// 쪽 나눔을 잴 때(measuring)는 스팬 없는 평문으로 그린다.
// 스팬은 인라인이고 여백이 없어 높이에 영향을 주지 않는다 (928개 전수 비교로 확인).
// 측정용 DOM이 가벼워져 재분할이 빨라진다.
let measuring = false;
const exCache = new Map();
function exHTML(item, keyOverride){
  const ck = (measuring ? 'm|' : 'v|') + (keyOverride || item.key);
  const hit = exCache.get(ck);
  if(hit) return hit;
  const html = buildEx(item, measuring);
  exCache.set(ck, html);
  return html;
}

function buildEx(item, plain){
  const parts = plain ? null : alignRuby(item.e, item.ek);
  let jp, kn;
  if(!parts){
    jp = esc(item.e); kn = esc(item.ek);
  }else{
    jp = ''; kn = '';
    let n = 0;
    for(const p of parts){
      if(p.r === null){ jp += esc(p.t); kn += esc(p.t); }
      else{
        jp += '<span class="kj" data-k="' + n + '" data-r="' + esc(p.r) + '">' + esc(p.t) + '</span>';
        kn += '<span class="kr" data-k="' + n + '">' + esc(p.r) + '</span>';
        n++;
      }
    }
  }
  return '<div class="ex">' +
    '<div class="ex-jp jp">' + spkBtn(item.e) + '<span>' + jp + '</span></div>' +
    '<div class="ex-kana jp">' + kn + '</div>' +
    '<div class="ex-ko">' + esc(item.eo) + '</div>' +
  '</div>';
}

// 표지 — 강의 시작. 반드시 한 쪽을 통째로 쓴다.
function coverHTML(item){
  const info = SEC_INFO[item.si] || {};
  // 문법 표지는 sub/meta를 직접 적고, 단어 표지는 섹션에서 계산한다
  const sub  = item.sub  || (info.from ? info.count + '단어 · ' + info.from + '–' + info.to + '번' : '');
  const meta = item.meta || '';
  const body = item.bullets
    ? '<ul class="cv-list">' + item.bullets.map(b => '<li>' + esc(b) + '</li>').join('') + '</ul>'
    : item.peek
    ? '<div class="cv-peek jp">' + item.peek.map(w => '<span>' + esc(w) + '</span>').join('') + '</div>'
    : '';
  return '<article class="entry cover">' +
    '<div class="cv-no">' + esc(item.no) + '</div>' +
    '<h2 class="cv-t jp">' + esc(item.t) + '</h2>' +
    (sub ? '<div class="cv-sub">' + esc(sub) + '</div>' : '') +
    '<div class="cv-rule"></div>' +
    '<p class="cv-lead">' + esc(item.lead) + '</p>' +
    body +
    (meta ? '<div class="cv-meta">' + esc(meta) + '</div>' : '') +
  '</article>';
}

// 짝 카드 — 타동사와 자동사를 나란히
function pairHTML(item, idx){
  const on = marks.has(idx);
  const side = (v, cls, label, ck) =>
    '<div class="prow">' +
      '<span class="ptag ' + cls + '">' + label + '</span>' +
      '<div class="pmain">' +
        '<div class="pline">' +
          '<b class="jp">' + esc(v.w) + '</b>' +
          '<span class="read jp">' + esc(v.r) + '</span>' +
          '<span class="mean-inline">' + esc(v.k) + '</span>' +
          spkBtn(v.r) +
        '</div>' +
        exHTML(v, ck) +
      '</div>' +
    '</div>';
  return '<article class="entry pair' + (on ? ' marked' : '') + '" data-i="' + idx + '">' +
    '<div class="e-head">' +
      '<span class="word jp">' + esc(item.tr.w) + '</span>' +
      '<span class="p-arrow">↔</span>' +
      '<span class="word jp">' + esc(item.itr.w) + '</span>' +
      (item.hint ? '<span class="pos">' + esc(item.hint) + '</span>' : '') +
      '<button class="ibtn mark' + (on ? ' on' : '') + '" type="button" data-mark="' + idx + '" ' +
        'aria-pressed="' + on + '" aria-label="책갈피">' + ICON.mark + '</button>' +
    '</div>' +
    side(item.tr,  'tr',  '타', item.key + '|tr') +
    side(item.itr, 'itr', '자', item.key + '|itr') +
  '</article>';
}

// 설명 카드 — 문법 개념
function noteHTML(item){
  // 칸 사이 화살표는 여기서 넣는다. 데이터에 "→"를 직접 적으면 두 개가 겹쳐 나오므로
  // 그런 칸은 걸러낸다 (두 번 저지른 실수라 아예 막아둔다).
  const rows = (item.rows || []).map(row => {
    const r = row.filter(c => String(c).trim() !== '→');
    return '<div class="nrow">' + r.map((c, i) =>
      '<span class="ncell' + (i === r.length - 1 ? ' last' : '') + ' jp">' + esc(c) + '</span>'
    ).join('<span class="narrow">→</span>') + '</div>';
  }).join('');
  return '<article class="entry note">' +
    '<h3 class="note-t">' + esc(item.t) + '</h3>' +
    item.p.map(t => '<p class="note-p">' + esc(t) + '</p>').join('') +
    (rows ? '<div class="nrows">' + rows + '</div>' : '') +
  '</article>';
}

// 활용 카드 — 단계 체인 (기본형 → 어간 → 목표 형태)
function conjHTML(item, idx){
  const on = marks.has(idx);
  return '<article class="entry conj' + (on ? ' marked' : '') + '" data-i="' + idx + '">' +
    '<div class="e-head">' +
      '<span class="word jp">' + esc(item.w) + '</span>' +
      '<span class="read jp">' + esc(item.r) + '</span>' +
      '<span class="mean-inline">' + esc(item.k) + '</span>' +
      '<span class="pos">' + esc(item.g) + '</span>' +
      '<button class="ibtn mark' + (on ? ' on' : '') + '" type="button" data-mark="' + idx + '" ' +
        'aria-pressed="' + on + '" aria-label="책갈피">' + ICON.mark + '</button>' +
    '</div>' +
    '<div class="chain">' +
      item.steps.map((s, n) =>
        '<span class="step' + (n === item.steps.length - 1 ? ' hit' : '') + '">' +
          '<b class="jp">' + esc(s.t) + '</b><em>' + esc(s.l) + '</em></span>'
      ).join('<span class="carrow">→</span>') +
      spkBtn(item.say) +
    '</div>' +
    exHTML(item) +
  '</article>';
}

// 형용사 활용 카드 — 네 형태를 한 판에
// 동사 활용 카드(chain)는 '기본형 → 중간형 → 완성형'이라 화살표가 맞지만,
// 형용사의 네 형태는 서로 유도되는 게 아니라 나란히 놓인 선택지다. 그래서 표로 깐다.
function adjcHTML(item, idx){
  const on = marks.has(idx);
  const showRead = item.r && item.r !== item.w;
  return '<article class="entry adjc' + (on ? ' marked' : '') + '" data-i="' + idx + '">' +
    '<div class="e-head">' +
      '<span class="word jp">' + esc(item.w) + '</span>' +
      (showRead ? '<span class="read jp">' + esc(item.r) + '</span>' : '') +
      '<span class="mean-inline">' + esc(item.k) + '</span>' +
      '<span class="pos">' + esc(item.g) + '</span>' +
      '<button class="ibtn mark' + (on ? ' on' : '') + '" type="button" data-mark="' + idx + '" ' +
        'aria-pressed="' + on + '" aria-label="책갈피">' + ICON.mark + '</button>' +
    '</div>' +
    '<div class="fgrid">' +
      item.forms.map(f =>
        '<div class="fcell' + (f[1] === item.hit ? ' hit' : '') + '">' +
          '<div class="ftxt">' +
            '<em>' + esc(f[0]) + '</em>' +
            '<b class="jp">' + esc(f[1]) + '</b>' +
            '<span class="fr jp">' + esc(f[2]) + '</span>' +
          '</div>' + spkBtn(f[2]) +
        '</div>').join('') +
    '</div>' +
    exHTML(item) +
  '</article>';
}

function entryHTML(item, idx){
  if(item.cover) return coverHTML(item);
  if(item.note) return noteHTML(item);
  if(item.pair) return pairHTML(item, idx);
  if(item.adjc) return adjcHTML(item, idx);
  if(item.conj) return conjHTML(item, idx);
  const on = marks.has(idx);
  const showRead = item.r && item.r !== item.w;
  return '<article class="entry' + (on ? ' marked' : '') + '" data-i="' + idx + '">' +
    '<div class="e-head">' +
      '<span class="num">' + String(item.n).padStart(3,'0') + '</span>' +
      '<span class="word jp">' + esc(item.w) + '</span>' +
      (showRead ? '<span class="read jp">' + esc(item.r) + '</span>' : '') +
      spkBtn(item.r || item.w) +
      '<span class="pos">' + esc(item.p) + '</span>' +
      '<button class="ibtn mark' + (on ? ' on' : '') + '" type="button" data-mark="' + idx + '" ' +
        'aria-pressed="' + on + '" aria-label="책갈피">' + ICON.mark + '</button>' +
    '</div>' +
    '<div class="mean">' + esc(item.k) + '</div>' +
    exHTML(item) +
  '</article>';
}

/* ============================================================
   화면 높이에 맞춰 쪽 나누기 — 스크롤이 생기지 않도록
   빈 페이지 틀을 먼저 깔아 실제 폭·높이를 잰 뒤,
   같은 폭에서 항목 높이를 측정해 넘치기 직전까지만 담는다.
   ============================================================ */
const spreadEl = document.getElementById('spread');
// 폭이 넉넉하면 두 쪽 펼침. 기준을 700으로 둔 이유:
//  - 폰 가로(844×390)에서 한 면만 쓰면 넓은 화면에 단어 하나만 남아 낭비된다
//  - 태블릿 세로(820)에서 한 면이면 한 줄이 100자를 넘어 읽기 나쁘다
// 두 쪽이면 한 면이 320px 이상 확보돼 줄 길이가 적당해진다.
const isSpread = () => window.innerWidth >= 700;

let PAGES = [];    // [[단어번호, ...], ...]
let PAGE_OF = [];  // 단어번호 -> 쪽 인덱스
let PAGE_TALL = new Set();   // 항목이 쪽보다 커서 스크롤을 열어야 하는 쪽
let cur = 0;       // 현재 쪽 인덱스

const shellHTML = '<div class="page"><div class="running"><b>&nbsp;</b></div>' +
                  '<div class="page-body"></div><div class="folio">&nbsp;</div></div>';

function paginate(){
  // 펼침면일 때는 빈 틀도 두 쪽을 깔아야 한다.
  // 한 쪽만 깔면 전체 폭에서 재게 되는데, 실제로는 절반 폭으로 그려져
  // 줄바꿈이 늘고 내용이 넘친다.
  spreadEl.innerHTML = isSpread() ? shellHTML + shellHTML : shellHTML;
  const pb = spreadEl.querySelector('.page-body');
  const cs = getComputedStyle(pb);
  const avail = pb.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - 4;

  // 현재 모드의 항목만 대상으로 한다
  const list = [];
  WORDS.forEach((w, i) => { if(w.kind === mode) list.push(i); });

  // 실제 페이지 폭 안에서 높이 측정
  measuring = true;
  const probe = document.createElement('div');
  probe.innerHTML = breakHTML('측정') + list.map(i => entryHTML(WORDS[i], i)).join('');
  measuring = false;
  pb.appendChild(probe);

  const kids = probe.children;
  const bs = getComputedStyle(kids[0]);
  const breakH = kids[0].offsetHeight + parseFloat(bs.marginTop) + parseFloat(bs.marginBottom);
  const H = {};
  list.forEach((gi, n) => { H[gi] = kids[n + 1].offsetHeight; });
  probe.remove();

  PAGES = [];
  const tooTall = new Set();
  let page = [], h = 0;
  for(const i of list){
    if(H[i] > avail) tooTall.add(i);
    // 표지는 한 쪽을 통째로 쓴다 — 앞의 쪽을 끊고, 혼자 한 쪽을 차지한 뒤 새로 시작
    if(WORDS[i].cover){
      if(page.length) PAGES.push(page);
      PAGES.push([i]);
      page = []; h = 0;
      continue;
    }
    const needBreak = page.length > 0 && WORDS[i].sec !== WORDS[page[page.length - 1]].sec;
    const add = H[i] + (needBreak ? breakH : 0);
    if(page.length && h + add > avail){          // 넘치면 새 쪽으로
      PAGES.push(page); page = [i]; h = H[i];
    }else{
      page.push(i); h += add;
    }
  }
  if(page.length) PAGES.push(page);

  PAGE_OF = [];
  PAGE_TALL = new Set();
  PAGES.forEach((p, pi) => {
    p.forEach(i => PAGE_OF[i] = pi);
    if(p.length === 1 && tooTall.has(p[0])) PAGE_TALL.add(pi);
  });
  cur = PAGE_OF[anchor] !== undefined ? PAGE_OF[anchor] : 0;
}

function setMode(m){
  if(m === mode) return;
  mode = m;
  store.set('kangi-mode', m);
  document.querySelectorAll('.mbtn').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  loadAnchor();
  relayout();
  if(drawer.classList.contains('open') && currentTab === 'toc') renderDrawer();
}

/* ============================================================
   쪽 그리기
   ============================================================ */
function pageHTML(p){
  const idxs = PAGES[p];
  let body = '', prevSec = null;
  idxs.forEach((i, j) => {
    const w = WORDS[i];
    if(j > 0 && w.sec !== prevSec) body += breakHTML(w.sec);
    prevSec = w.sec;
    body += entryHTML(w, i);
  });
  const head = WORDS[idxs[0]];
  const isCover = idxs.length === 1 && head.cover;
  const nums = idxs.map(i => WORDS[i].n).filter(n => n !== null);
  const range = (head.kind === 'grammar' || !nums.length) ? ''
    : nums[0] + '–' + nums[nums.length - 1];
  // 표지 쪽은 러닝헤드를 뺀다 — 제목이 이미 크게 있으니 중복이다
  const running = isCover ? ''
    : '<div class="running"><b>' + esc(head.sec) + '</b>' +
      '<span class="range">' + range + '</span></div>';
  return '<div class="page" data-page="' + p + '">' + running +
    '<div class="page-body' + (isCover ? ' cover-page' : '') +
      (PAGE_TALL.has(p) ? ' scrollable' : '') + '">' + body + '</div>' +
    '<div class="folio">' + (p + 1) + '</div>' +
  '</div>';
}

function render(){
  const two = isSpread();
  const last = PAGES.length - 1;
  cur = Math.min(Math.max(cur, 0), last);
  const start = two ? (cur - (cur % 2)) : cur;

  let html = pageHTML(start);
  if(two && start + 1 <= last) html += pageHTML(start + 1);
  spreadEl.innerHTML = html;

  const shown = (two && start + 1 <= last) ? (start + 1) + '–' + (start + 2) : String(start + 1);
  document.getElementById('pageno').innerHTML = '<b>' + shown + '</b> / ' + PAGES.length;
  document.getElementById('prev').disabled = start === 0;
  document.getElementById('next').disabled = two ? (start + 2 > last) : (cur === last);

  anchor = PAGES[start][0];
  store.set('kangi-anchor-' + mode, WORDS[anchor].key);
}

function relayout(){ paginate(); render(); }

function goTo(p, focusIdx){
  cur = Math.min(Math.max(p, 0), PAGES.length - 1);
  render();
  if(focusIdx !== undefined){
    const el = spreadEl.querySelector('.entry[data-i="' + focusIdx + '"]');
    if(el){
      el.classList.add('flash');
      setTimeout(() => el.classList.remove('flash'), 1600);
    }
  }
}
function step(dir){
  const two = isSpread();
  const start = two ? (cur - (cur % 2)) : cur;
  goTo(start + dir * (two ? 2 : 1));
}

relayout();

/* ============================================================
   상호작용 — 페이지
   ============================================================ */
document.getElementById('prev').addEventListener('click', () => step(-1));
document.getElementById('next').addEventListener('click', () => step(1));

document.querySelector('.modes').addEventListener('click', e => {
  const b = e.target.closest('.mbtn');
  if(b) setMode(b.dataset.mode);
});
document.querySelectorAll('.mbtn').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));

// 크기가 바뀌면 한 쪽에 들어갈 수 있는 단어 수도 바뀌므로 다시 나눈다.
// iframe 안(Artifact 등)에서는 창 resize 이벤트가 오지 않으므로 ResizeObserver로 관찰한다.
const stage = document.querySelector('.stage');
let resizeTimer = null, lastW = 0, lastH = 0;
function onResize(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const w = Math.round(stage.clientWidth), h = Math.round(stage.clientHeight);
    if(w === lastW && h === lastH) return;
    lastW = w; lastH = h;
    relayout();
  }, 180);
}
lastW = Math.round(stage.clientWidth);
lastH = Math.round(stage.clientHeight);
if(window.ResizeObserver) new ResizeObserver(onResize).observe(stage);
window.addEventListener('resize', onResize);

document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT' || e.metaKey || e.ctrlKey || e.altKey) return;
  if(e.key === 'Escape'){ closeDrawer(); return; }
  if(e.key === '/'){ document.getElementById('searchBtn').click(); e.preventDefault(); return; }
  if(e.key === 'ArrowLeft'){ step(-1); e.preventDefault(); }
  if(e.key === 'ArrowRight'){ step(1); e.preventDefault(); }
});

let tx = 0, ty = 0;
spreadEl.addEventListener('touchstart', e => { tx = e.changedTouches[0].clientX; ty = e.changedTouches[0].clientY; }, {passive:true});
spreadEl.addEventListener('touchend', e => {
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if(Math.abs(dx) > 60 && Math.abs(dy) < 50) step(dx < 0 ? 1 : -1);
}, {passive:true});

/* ============================================================
   상호작용 — 발음 / 책갈피
   ============================================================ */
/* 한자에 올리면 아래 가나 줄의 같은 부분을 함께 밝힌다 */
function litKana(kj, on){
  const entry = kj.closest('.entry');
  if(!entry) return;
  entry.querySelectorAll('.kr[data-k="' + kj.dataset.k + '"]')
       .forEach(x => x.classList.toggle('lit', on));
}
spreadEl.addEventListener('mouseover', e => {
  const kj = e.target.closest('.kj');
  if(kj) litKana(kj, true);
});
spreadEl.addEventListener('mouseout', e => {
  const kj = e.target.closest('.kj');
  if(kj && !kj.classList.contains('on')) litKana(kj, false);
});

// 터치 기기에는 hover가 없으므로 눌러서 켜고 끈다
function clearPinned(except){
  spreadEl.querySelectorAll('.kj.on').forEach(k => {
    if(k === except) return;
    k.classList.remove('on');
    litKana(k, false);
  });
}

spreadEl.addEventListener('click', e => {
  const kj = e.target.closest('.kj');
  if(kj){
    const on = !kj.classList.contains('on');
    clearPinned(kj);
    kj.classList.toggle('on', on);
    litKana(kj, on);
    return;
  }
  clearPinned(null);

  const spk = e.target.closest('.spk');
  if(spk){ speak(spk.dataset.say, spk); return; }

  const mk = e.target.closest('.mark');
  if(mk){
    const i = Number(mk.dataset.mark);
    const on = !marks.has(i);
    if(on) marks.add(i); else marks.delete(i);
    saveMarks();
    mk.classList.toggle('on', on);
    mk.setAttribute('aria-pressed', String(on));
    mk.closest('.entry').classList.toggle('marked', on);
    if(currentTab === 'marks') renderDrawer();
  }
});

   음성
   ============================================================ */
const synth = window.speechSynthesis;
const warnEl = document.getElementById('voiceWarn');
let jaVoice = null, playingBtn = null;

function showWarn(html){ warnEl.innerHTML = html; warnEl.classList.remove('hidden'); }

function pickVoice(){
  if(!synth) return;
  const v = synth.getVoices();
  if(!v.length) return;
  const ja = v.filter(x => (x.lang || '').toLowerCase().startsWith('ja'));
  if(ja.length){
    jaVoice = ja.find(x => x.localService) || ja[0];
    warnEl.classList.add('hidden');
  }else{
    showWarn('이 기기에 <b>일본어 음성</b>이 없어 발음이 어색할 수 있습니다. Windows에서는 ' +
             '<b>설정 → 시간 및 언어 → 언어 → 일본어 추가(음성 팩 포함)</b>를 설치하세요.');
  }
}
if(synth){
  pickVoice();
  synth.addEventListener('voiceschanged', pickVoice);
  setTimeout(pickVoice, 400);
  setTimeout(pickVoice, 1500);
}else{
  showWarn('이 브라우저는 발음 재생(Web Speech API)을 지원하지 않습니다. Chrome 또는 Edge에서 열어주세요.');
}

const rateEl = document.getElementById('rate');
const rateVal = document.getElementById('rateVal');
const savedRate = store.get('kangi-rate', null);
if(savedRate){ rateEl.value = savedRate; }
rateVal.textContent = Number(rateEl.value).toFixed(2);
rateEl.addEventListener('input', () => {
  rateVal.textContent = Number(rateEl.value).toFixed(2);
  store.set('kangi-rate', rateEl.value);
});

function clearPlaying(){
  if(playingBtn){ playingBtn.classList.remove('playing'); playingBtn = null; }
}
function speak(text, btn){
  if(!synth) return;
  const same = (playingBtn === btn);
  synth.cancel();
  clearPlaying();
  if(same) return;

  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ja-JP';
  if(jaVoice) u.voice = jaVoice;
  u.rate = Number(rateEl.value);
  u.onend = clearPlaying;
  u.onerror = ev => {
    clearPlaying();
    if(ev.error === 'interrupted' || ev.error === 'canceled') return;
    showWarn(jaVoice && !jaVoice.localService
      ? '지금 쓰는 일본어 음성(<b>' + esc(jaVoice.name) + '</b>)은 <b>인터넷 연결이 필요한</b> 음성입니다. ' +
        '연결을 확인하거나, Windows <b>설정 → 시간 및 언어 → 언어 → 일본어 추가(음성 팩 포함)</b>를 설치하면 오프라인에서도 재생됩니다.'
      : '발음을 재생하지 못했습니다. 새로고침한 뒤 다시 눌러보세요.');
  };
  btn.classList.add('playing');
  playingBtn = btn;
  synth.speak(u);
}
window.addEventListener('pagehide', () => { if(synth) synth.cancel(); });

/* ============================================================
   서랍 — 목차 / 책갈피
   ============================================================ */
const drawer = document.getElementById('drawer');
const scrim = document.getElementById('scrim');
const drawerBody = document.getElementById('drawerBody');
let currentTab = 'toc';

/* ---- 검색 ----
   가타카나는 히라가나로 맞춰서 비교한다. 「サッカー」를 「さっかー」로 쳐도 찾히도록. */
const kataToHira = s => s.replace(/[ァ-ヶ]/g,
  c => String.fromCharCode(c.charCodeAt(0) - 0x60));
const norm = s => kataToHira(String(s || '').toLowerCase()).replace(/[\s·・、。！？]/g, '');

// 검색 대상: 단어 카드와 활용 카드. 설명 카드는 제외.
const SEARCH = [];
WORDS.forEach((w, i) => {
  if(w.note || w.cover) return;
  if(w.pair){
    SEARCH.push({
      i,
      head: [w.tr.w, w.tr.r, w.itr.w, w.itr.r].map(norm).join(' '),
      mean: norm(w.tr.k) + ' ' + norm(w.itr.k),
      body: [w.tr.e, w.tr.ek, w.tr.eo, w.itr.e, w.itr.ek, w.itr.eo].map(norm).join(' ')
    });
    return;
  }
  // 형용사 활용 카드는 네 형태도 검색에 넣는다.
  // 「たかかった」로 쳐서 못 찾으면 활용표를 만든 의미가 없다.
  const forms = w.forms ? ' ' + w.forms.map(f => norm(f[1]) + ' ' + norm(f[2])).join(' ') : '';
  SEARCH.push({
    i,
    head: norm(w.w) + ' ' + norm(w.r) + forms,
    mean: norm(w.k),
    body: norm(w.e) + ' ' + norm(w.ek) + ' ' + norm(w.eo) + ' ' + norm(w.p || w.g)
  });
});

function search(qRaw){
  const q = norm(qRaw);
  if(!q) return [];
  const hits = [];
  for(const s of SEARCH){
    let score = -1;
    if(s.head.split(' ').some(t => t.startsWith(q))) score = 0;
    else if(s.mean.startsWith(q)) score = 1;
    else if(s.head.includes(q) || s.mean.includes(q)) score = 2;
    else if(s.body.includes(q)) score = 3;
    if(score >= 0) hits.push({i:s.i, score});
  }
  hits.sort((a, b) => a.score - b.score || a.i - b.i);
  return hits.slice(0, 80);
}

// 결과가 다른 모드에 있으면 쪽번호 대신 어느 쪽 책인지 표시한다
function locLabel(i){
  if(WORDS[i].kind !== mode)
    return '<span class="p alt">' + (WORDS[i].kind === 'grammar' ? '문법' : '단어') + '</span>';
  return '<span class="p">p.' + (PAGE_OF[i] + 1) + '</span>';
}

function renderSearch(){
  const q = document.getElementById('q').value;
  const hits = search(q);
  if(!q.trim()){
    drawerBody.innerHTML = '<p class="dempty">단어, 히라가나, 한국어 뜻 아무거나 입력하세요.<br>' +
      '예문 안의 말로도 찾을 수 있습니다.</p>';
    return;
  }
  if(!hits.length){
    drawerBody.innerHTML = '<p class="dempty">「' + esc(q) + '」에 해당하는 단어가 없습니다.</p>';
    return;
  }
  drawerBody.innerHTML = '<p class="qcount">' + hits.length + '개' +
      (hits.length === 80 ? ' 이상' : '') + '</p>' +
    hits.map(h => {
      const it = WORDS[h.i];
      const showRead = it.r && it.r !== it.w;
      // 활용 카드는 같은 동사가 강의마다 나오므로 목표 형태까지 보여줘야 구분된다
      if(it.pair){
        return '<button class="dlink" type="button" data-focus="' + h.i + '">' +
          '<span><span class="jpw jp">' + esc(it.tr.w) + ' ↔ ' + esc(it.itr.w) + '</span>' +
          '<span class="tag">타/자</span></span>' + locLabel(h.i) + '</button>';
      }
      const tail = it.conj
        ? '<span class="sub jp">→ ' + esc(it.steps[it.steps.length - 1].t) + '</span>' +
          '<span class="tag">활용</span>'
        : it.adjc
        ? '<span class="sub jp">→ ' + esc(it.forms[2][1]) + '</span>' +
          '<span class="tag">활용</span>'
        : '<span class="sub">' + esc(it.k) + '</span>';
      return '<button class="dlink" type="button" data-focus="' + h.i + '">' +
        '<span><span class="jpw jp">' + esc(it.w) + '</span> ' +
        (showRead ? '<span class="sub jp">' + esc(it.r) + '</span> ' : '') +
        tail + '</span>' +
        locLabel(h.i) +
      '</button>';
    }).join('');
}

function renderDrawer(){
  document.getElementById('qbox').classList.toggle('on', currentTab === 'search');
  if(currentTab === 'search'){ renderSearch(); return; }
  if(currentTab === 'toc'){
    drawerBody.innerHTML = SEC_INFO.filter(s => s.kind === mode).map(s => {
      const p = PAGE_OF[s.first];
      const sub = s.kind === 'grammar'
        ? s.count + '개 항목'
        : s.from + '–' + s.to + '번 · ' + s.count + '단어';
      return '<button class="dlink" type="button" data-focus="' + s.first + '">' +
        '<span>' + esc(s.title) + '<br><span class="sub">' + sub + '</span></span>' +
        '<span class="p">p.' + (p + 1) + '</span>' +
      '</button>';
    }).join('');
  }else{
    const list = [...marks].sort((a,b) => a - b);
    if(!list.length){
      drawerBody.innerHTML = '<p class="dempty">아직 책갈피가 없습니다.<br>' +
        '단어 오른쪽의 책갈피 아이콘을 누르면 여기에 모입니다.</p>';
      return;
    }
    drawerBody.innerHTML = list.map(i => {
      const it = WORDS[i];
      // 짝 카드에는 w·k가 없다 (tr·itr 두 짝으로 들어있다). 그대로 찍으면 undefined가 나온다.
      const head = it.pair ? esc(it.tr.w) + ' ↔ ' + esc(it.itr.w) : esc(it.w);
      const sub  = it.pair ? '타/자' : it.k;
      return '<button class="dlink" type="button" data-focus="' + i + '">' +
        '<span><span class="jpw jp">' + head + '</span> ' +
        '<span class="sub">' + esc(sub) + '</span></span>' +
        locLabel(i) +
      '</button>';
    }).join('');
  }
}
function openDrawer(){ renderDrawer(); drawer.classList.add('open'); scrim.classList.add('open'); }
function closeDrawer(){ drawer.classList.remove('open'); scrim.classList.remove('open'); }

document.getElementById('drawerBtn').addEventListener('click', () => {
  if(currentTab === 'search') setTab('toc');
  openDrawer();
});
document.getElementById('searchBtn').addEventListener('click', () => {

  q.select();

});
document.getElementById('dclose').addEventListener('click', closeDrawer);
scrim.addEventListener('click', closeDrawer);

document.getElementById('q').addEventListener('input', renderSearch);

function setTab(name){
  currentTab = name;
  document.querySelectorAll('.dtab').forEach(t => t.classList.toggle('on', t.dataset.tab === name));
  renderDrawer();

document.querySelector('.drawer-head').addEventListener('click', e => {

drawerBody.addEventListener('click', e => {
  const link = e.target.closest('.dlink');
  if(!link) return;
  closeDrawer();
  const i = Number(link.dataset.focus);
  if(WORDS[i].kind !== mode) setMode(WORDS[i].kind);   // 다른 책이면 먼저 넘어간다
  goTo(PAGE_OF[i], i);
});

/* ============================================================
   테마
   ============================================================ */
const themeBtn = document.getElementById('themeBtn');
// 밝은 화면이 기본. 야간은 직접 켤 때만 적용된다.
const isDarkNow = () => document.documentElement.getAttribute('data-theme') === 'dark';
const MOON = '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>';
const SUN  = '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>';
function applyTheme(dark){
  if(dark) document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('themeLabel').textContent = dark ? '주간' : '야간';
  document.getElementById('themeIcon').innerHTML = dark ? SUN : MOON;
  themeBtn.setAttribute('aria-label', dark ? '주간 모드로' : '야간 모드로');
}
applyTheme(store.get('kangi-night', false));
themeBtn.addEventListener('click', () => {
  const next = !isDarkNow();
  store.set('kangi-night', next);
  applyTheme(next);
});

/* ============================================================
   인쇄 — 전체 페이지 펼치기
   ============================================================ */
// 화면의 쪽 나눔은 창 크기에 따른 것이라, 인쇄할 때는
// 주제별로 이어지는 한 문서로 만들어 종이를 낭비하지 않는다.
let printBackup = null;
window.addEventListener('beforeprint', () => {
  printBackup = spreadEl.innerHTML;
  let html = '', prevSec = null;
  WORDS.forEach((w, i) => {
    if(w.sec !== prevSec){ html += breakHTML(w.sec); prevSec = w.sec; }
    html += entryHTML(w, i);
  });
  spreadEl.innerHTML = '<div class="page"><div class="page-body">' + html + '</div></div>';
});
window.addEventListener('afterprint', () => {
  if(printBackup !== null){ spreadEl.innerHTML = printBackup; printBackup = null; }
});
</script>
</body>
